name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # a throwaway Postgres so tests/test_postgres.py runs against the real thing
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trading
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trader -d trading"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://trader:trader@localhost:5432/trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: pytest -q

  docker-build:
    # Proves all three images still build. Pushing to AWS stays a manual step for now.
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [backtester, live_trader, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/${{ matrix.service }}.Dockerfile -t stratos-${{ matrix.service }} .
